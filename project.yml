name: FalcoFold

options:
  bundleIdPrefix: io.github.pietrouk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FalcoFold:
    type: application
    platform: macOS
    sources:
      - path: FalcoFold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pietrouk.FalcoFold
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: FalcoFold
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Pietro Falcone. MIT License."
        # Free "Personal Team" Apple Development certificate. A stable signature
        # keeps the Screen Recording permission across rebuilds.
        # To build with your own Apple ID, change DEVELOPMENT_TEAM to your team ID.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: T5X7ZQWCKE
        ENABLE_HARDENED_RUNTIME: "NO"
